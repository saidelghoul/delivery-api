services:
  - type: web
    name: delivery-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: postgress_delivery_app
          property: connectionString

databases:
  - name: postgress_delivery_app
    region: frankfurt
    plan: free
    databaseName: postgress_delivery_app
    user: postgress_delivery_app_user
